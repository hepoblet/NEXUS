# Codex CLI project config. AGENTS.md is read automatically.

[agents]
max_threads = 4
max_depth = 1

[agents.dev]
description = "Implementa tasks [S]/[M] siguiendo plan.md; no toca pruebas."
config_file = "agents/dev.toml"

[agents.tester]
description = "Convierte criterios de aceptación en pruebas automatizadas."
config_file = "agents/tester.toml"

[agents.reviewer]
description = "Revisa cambios: checks del stack, AGENTS.md y spec. Reporta, no arregla."
config_file = "agents/reviewer.toml"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_TOKEN}" }
